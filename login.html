<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Login | Lumina Resorts</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-container">



    <div class="login-card reveal">

        <a href="index.html" class="logo" style="display: block; margin-bottom: 2rem;">LUMINA</a>
        <h2 style="margin-bottom: 1rem;">Guest Portal</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Enter your booking reference or email to access your
            stay details.</p>

        <form id="login-form" novalidate>
            <div class="input-wrap">
                <input id="login-email" type="email" required autocomplete="email">
                <label for="login-email">Email Address</label>
                <span class="focus-border"></span>
            </div>
            <div class="input-wrap">
                <input id="booking-id" type="text" autocomplete="off">
                <label for="booking-id">Booking ID (Optional)</label>
                <span class="focus-border"></span>
            </div>
            <button type="submit" class="btn-primary">Continue</button>
            <p id="login-status" class="login-status" aria-live="polite"></p>
        </form>

        <div style="margin-top: 3rem; text-align: left; background: var(--accent); padding: 1.5rem; border-radius: 20px;" class="reveal">
            <h4 style="margin-bottom: 1rem; font-size: 0.9rem; color: var(--secondary);">Why sign in?</h4>
            <ul style="list-style: none; font-size: 0.8rem; color: var(--text-muted);">
                <li style="margin-bottom: 0.5rem;"><i class="fas fa-check-circle" style="color: var(--secondary);"></i> Manage your luxury itinerary</li>
                <li style="margin-bottom: 0.5rem;"><i class="fas fa-check-circle" style="color: var(--secondary);"></i> Request private chauffeur services</li>
                <li><i class="fas fa-check-circle" style="color: var(--secondary);"></i> Access room service directly</li>
            </ul>
        </div>

        <div style="margin-top: 2rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Experience the ultimate stay. <a href="index.html"
                    style="color: var(--secondary); text-decoration: none;">Return Home</a></p>
        </div>
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;"><i
                    class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
