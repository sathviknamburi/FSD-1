<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Tours | Lumina Resorts</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav>
        <a href="index.html" class="logo">LUMINA</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="booking.html">Booking</a></li>
            <li><a href="tours.html">Tours</a></li>
        </ul>
        <a href="login.html" class="btn-login">Guest Login</a>
    </nav>

    <div style="height: 100px;"></div>

    <section class="container">
        <div class="section-title">
            <h2 style="color: var(--secondary);">Exclusive City Packages</h2>
            <p>Explore complete city experiences with luxury transport and expert guides.</p>
        </div>

        <div class="filter-bar">
            <div class="search-input">
                <input type="text" id="tour-search" placeholder="Search city packages (e.g. Paris, Tokyo)...">
            </div>
        </div>

        <div id="tours-grid" class="grid">
            <!-- Tours injected by JS -->
        </div>
    </section>

    <!-- Tour Modal -->
    <div id="tour-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTourModal()">&times;</span>
            <div id="tour-modal-body">
                <!-- Data injected via JS -->
            </div>
        </div>
    </div>

    <footer style="padding: 3rem 5%; text-align: center; border-top: 1px solid var(--glass-border);">
        <p>&copy; 2026 Lumina Resorts. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
